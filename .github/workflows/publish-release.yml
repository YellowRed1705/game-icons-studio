name: Build and Publish Game Icons Studio Release

on:
  # Adding a new version changelog to main is the intentional release signal.
  # Other ordinary pushes do not publish a release.
  push:
    branches:
      - main
    paths:
      - 'CHANGELOG-v*.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v prefix; must match the checked-in README and CHANGELOG (for example 6.37)'
        required: true
        type: string
      reply_to_issues:
        description: 'Post the prepared replies to issues #1 and #2 (manual runs only)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate browser JavaScript syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $webText = Get-Content -LiteralPath 'data/src/WebApp.ps1' -Raw
          $scripts = [regex]::Matches($webText, '(?is)<script\b[^>]*>(.*?)</script>')
          if ($scripts.Count -ne 1) { throw "Expected one browser script block, found $($scripts.Count)." }
          $scriptPath = Join-Path $env:RUNNER_TEMP 'game-icons-studio-webapp.js'
          [System.IO.File]::WriteAllText($scriptPath, $scripts[0].Groups[1].Value, [System.Text.UTF8Encoding]::new($false))
          node --check $scriptPath
          if ($LASTEXITCODE -ne 0) { throw 'Browser JavaScript syntax check failed.' }

          $scriptFiles = @(Get-ChildItem -LiteralPath 'data/src' -Filter '*.ps1' -File) + @(Get-ChildItem -LiteralPath 'scripts' -Filter '*.ps1' -File)
          foreach ($file in $scriptFiles) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              $messages = ($parseErrors | ForEach-Object { "$($_.Message) (line $($_.Extent.StartLineNumber))" }) -join '; '
              throw "PowerShell syntax check failed in $($file.FullName): $messages"
            }
          }
          Write-Host "Syntax validation passed for $($scriptFiles.Count) PowerShell scripts."

      - name: Validate release version and ensure tag is unused
        id: version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_BRANCH -ne 'main') { throw 'Run the release workflow from the main branch.' }

          if ($env:EVENT_NAME -eq 'push') {
            $changedFiles = @(git diff-tree --no-commit-id --name-only -r $env:GITHUB_SHA)
            $changelogFiles = @($changedFiles | Where-Object { $_ -match '^CHANGELOG-v\d+\.\d+\.md$' })
            if ($changelogFiles.Count -ne 1) {
              throw "Automatic release expects exactly one new version changelog in this commit; found $($changelogFiles.Count)."
            }
            $version = [regex]::Match($changelogFiles[0], '^CHANGELOG-v(\d+\.\d+)\.md$').Groups[1].Value
          } else {
            $version = ($env:RELEASE_VERSION -as [string]).Trim()
          }

          if ($version -notmatch '^\d+\.\d+$') { throw "Version must be numeric like 6.37 without a leading v; got '$version'." }
          $tag = "v$version"
          $remote = git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}"
          if ($LASTEXITCODE -notin @(0, 2)) { throw 'Could not check remote tags.' }
          if (-not [string]::IsNullOrWhiteSpace(($remote | Out-String))) { throw "Tag $tag already exists; choose a new version." }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "Validated release tag $tag"

      - name: Build clean release archives
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          .\scripts\Build-Release.ps1 -Version $env:RELEASE_VERSION -RepositoryRoot $env:GITHUB_WORKSPACE -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'release-output')

      - name: Publish GitHub Release and upload ZIPs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Game Icons Studio v${{ steps.version.outputs.version }}
          body_path: release-output/ReleaseNotes.md
          files: |
            release-output/Game-Icons-Studio-v${{ steps.version.outputs.version }}.zip
            release-output/Game-Icons-Studio-v${{ steps.version.outputs.version }}-Upgrade.zip
            release-output/SHA256SUMS.json
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Reply to the two prepared feature requests (manual opt-in only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reply_to_issues }}
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const version = process.env.RELEASE_VERSION.startsWith('v')
              ? process.env.RELEASE_VERSION.slice(1)
              : process.env.RELEASE_VERSION;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const messages = [
              {
                issue_number: 1,
                marker: `<!-- gis-release-${version}-issue-1 -->`,
                body: `Thanks for the suggestion, and sorry for the long wait! Restore points are available with configurable retention. The app snapshots relevant shortcut and folder icon state before applying changes and provides a restore flow. Please try v${version} and let us know if you encounter any restoration issues.\n\n<!-- gis-release-${version}-issue-1 -->`
              },
              {
                issue_number: 2,
                marker: `<!-- gis-release-${version}-issue-2 -->`,
                body: `Thanks for the suggestion, and apologies for the delay! Local image selection is supported, including drag-and-drop, clipboard paste, and image URL input. Selected images are processed through the app's ICO conversion pipeline, so you can use your own square artwork when catalogue results are not suitable. Please try v${version} and let us know how it works for you.\n\n<!-- gis-release-${version}-issue-2 -->`
              }
            ];
            for (const item of messages) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: item.issue_number, per_page: 100
              });
              if (comments.some(c => (c.body || '').includes(item.marker))) {
                core.info(`Issue #${item.issue_number}: reply for v${version} already exists; skipping.`);
                continue;
              }
              await github.rest.issues.createComment({
                owner, repo, issue_number: item.issue_number, body: item.body
              });
              core.info(`Posted prepared reply to issue #${item.issue_number}.`);
            }
